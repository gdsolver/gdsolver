# Windows, and Android as an experiment (docs/ANDROID.md). The Android job may fail while the
# port is under way and never decides the run; only the Windows package is attached to a release.
# The other platforms in Geode's example workflow cannot build this.
#
# The point of building here rather than locally is that the binary attached to a release can be
# traced to a commit of the public tree. The pitfalls page asks for it for that reason ("makes it
# easier for us to verify that a mod has not been tampered with").
#
# This can only prove the mod compiles. The behaviour bar -- py/quick_regress.py and the cold
# regression -- needs Geometry Dash itself, so it stays a local step.
name: Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
  # Not on tag push: the release does not exist yet at that point and the upload below would have
  # nowhere to go. Publishing the release is the event that wants a binary.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # `sdk: given` (the default) takes the Geode version out of mod.json, so CI and a desk
      # build are the same SDK without a second place to keep it up to date.
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: geode-package
          path: ${{ steps.build.outputs.build-output }}

      # The file is named after the mod id, so it is matched rather than spelled out -- the id
      # changed once already and took four hardcoded copies of the old name with it.
      - name: Attach it to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.build.outputs.build-output }}"/*.geode --clobber

  android:
    name: Android64 (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      # The solver CLI (leveldp and its test drivers) is a desktop tool; only the mod is built.
      - name: Build the mod
        id: build
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          configure-args: -DGDSOLVER_BUILD_DP=OFF -DCMAKE_CXX_FLAGS=-ferror-limit=0

      # ninja stops at the first failing file. While the port is incomplete, go on through
      # the same build directory, keep every error, and end the log with each distinct one
      # once (most frequent first), so one run gives the whole list in its last lines.
      - name: List every compile error
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set +e
          cmake --build build -- -k 0 > build-errors.log 2>&1
          status=$?
          echo "=== distinct errors (count, place, message) ==="
          grep -E "error:" build-errors.log | sed -E "s#${GITHUB_WORKSPACE}/##" \
            | sort | uniq -c | sort -rn
          echo "=== translation units that failed ==="
          grep -E "^FAILED:" build-errors.log | sed -E 's#.* -c ##; s#'"${GITHUB_WORKSPACE}"'/##' | sort -u
          exit $status

      - name: Upload the package
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: geode-package-android64
          path: ${{ steps.build.outputs.build-output }}
