# The package for Geometry Dash 2.2091 on Geode 6.0.0 (mod.json names both platforms), built with geode-sdk/build-geode-mod: upstream's own action, the SDK of the
# version mod.json asks for and the bindings of geode-sdk/bindings pinned to the commit below. Windows (Ninja + clang + Release + LTO) and Android64 are built by
# one job each, and the `package` job joins the two into the one `gdsolver.solver.geode` (geode package merge, through upstream's combine action). That
# single file is what a release carries, whatever the platform of the person installing it.
#
# The point of building here rather than locally is that the binary attached to a release can be traced to a commit of the public tree. The pitfalls
# page asks for it for that reason ("makes it easier for us to verify that a mod has not been tampered with").
#
# This can only prove the mod compiles. The behaviour bar -- py/quick_regress.py and the cold regression -- needs Geometry Dash itself, so it stays a
# local step, and nothing here has run the Android build on a device.
name: Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
  # Not on tag push: the release does not exist yet at that point and the upload below would have
  # nowhere to go. Publishing the release is the event that wants a binary.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (GD 2.2091, Geode 6)
            os: windows-latest
            target: Win64
          - name: Android64 (GD 2.2091, Geode 6)
            os: ubuntu-latest
            target: Android64

    steps:
      - uses: actions/checkout@v7

      # The solver CLI (leveldp and its test drivers) is a desktop tool; only the mod is built. bindings-ref pins the bindings: the SDK would take the latest
      # main otherwise, and a release must build from what was tested (the commit the release candidate was built and run with). combine: the action keeps
      # this platform's binary for the package job below instead of a package of its own.
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.target }}
          sdk: given
          bindings-ref: d14587bf6c08b9114b5605ec6a3c42cc16b02de6   # the upstream bindings commit the measured candidate was built with (2026-11-25)
          configure-args: -DGDSOLVER_BUILD_DP=OFF

  package:
    name: Package (Windows + Android in one .geode)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Join the builds
        id: package
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: geode-package
          path: ${{ steps.package.outputs.build-output }}

      # The file is named after the mod id, so it is matched rather than spelled out -- the id
      # changed once already and took four hardcoded copies of the old name with it. Only a full release gets it: a pre-release
      # gets no package from here.
      - name: Attach it to the release
        if: github.event_name == 'release' && !github.event.release.prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.package.outputs.build-output }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "$OUT"/*.geode --clobber --repo "${{ github.repository }}"
